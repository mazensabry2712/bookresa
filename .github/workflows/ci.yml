name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none

      - name: Validate Composer files
        run: composer validate --no-check-publish

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: PHPStan static analysis
        run: vendor/bin/phpstan analyse --memory-limit=2G

      - name: PHP syntax scan
        run: find app -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Pint changed PHP files
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref="origin/$GITHUB_BASE_REF"
          else
            base_ref="HEAD^"
          fi

          mapfile -d '' php_files < <(git diff --name-only -z "$base_ref" HEAD -- '*.php')

          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "No PHP files changed."
            exit 0
          fi

          vendor/bin/pint --test --format agent "${php_files[@]}"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install Node dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Feature and unit tests
        run: php artisan test --compact
